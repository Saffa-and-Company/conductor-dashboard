
<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00CDFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00CDFF" stop-opacity="0"/>
    </radialGradient>
    <style>
      .pulse {
        animation: pulse-animation 2s infinite;
      }
      @keyframes pulse-animation {
        0% { r: 5; opacity: 1; }
        50% { r: 10; opacity: 0.5; }
        100% { r: 5; opacity: 1; }
      }
    </style>
  </defs>

  <!-- Central Glow -->
  <circle cx="250" cy="250" r="25" fill="url(#glow)" />
  <circle cx="250" cy="250" r="5" fill="#00CDFF" class="pulse"/>

  <!-- Radial Connections -->
  <g stroke="#AAAAAA" stroke-width="1">
    <!-- Primary lines -->
    <line x1="250" y1="250" x2="250" y2="80"/>
    <line x1="250" y1="250" x2="420" y2="250"/>
    <line x1="250" y1="250" x2="250" y2="420"/>
    <line x1="250" y1="250" x2="80" y2="250"/>
    <line x1="250" y1="250" x2="350" y2="150"/>
    <line x1="250" y1="250" x2="150" y2="150"/>
    <line x1="250" y1="250" x2="350" y2="350"/>
    <line x1="250" y1="250" x2="150" y2="350"/>

    <!-- Secondary connections -->
    <line x1="350" y1="150" x2="420" y2="80"/>
    <line x1="150" y1="150" x2="80" y2="80"/>
    <line x1="350" y1="350" x2="420" y2="420"/>
    <line x1="150" y1="350" x2="80" y2="420"/>
  </g>

  <!-- Nodes with blue accents -->
  <g fill="#00CDFF">
    <circle cx="250" cy="80" r="3"/>
    <circle cx="420" cy="250" r="3"/>
    <circle cx="250" cy="420" r="3"/>
    <circle cx="80" cy="250" r="3"/>
    <circle cx="350" cy="150" r="3"/>
    <circle cx="150" cy="150" r="3"/>
    <circle cx="350" cy="350" r="3"/>
    <circle cx="150" cy="350" r="3"/>
    <circle cx="420" cy="80" r="2.5"/>
    <circle cx="80" cy="80" r="2.5"/>
    <circle cx="420" cy="420" r="2.5"/>
    <circle cx="80" cy="420" r="2.5"/>
  </g>
</svg>
